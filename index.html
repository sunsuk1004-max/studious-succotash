<title>김선숙 온라인 강의실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style id="app-style">
/* Layout: a measurement sheet. The course's weeks are drawn as a stem plot that doubles as navigation. */
:root{
  --bg:#f1f5f6;--panel:#fbfdfd;--ink:#14293a;--muted:#566b79;--line:#cdd9de;--grid:#e1e9ec;
  --accent:#0a6a8c;--on-accent:#ffffff;--soft:#dcecf1;--trace:#b8640f;--good:#1c7a55;--bad:#b23b34;
  --display:"Black Han Sans","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101a20;--panel:#172329;--ink:#e3ecef;--muted:#9db0ba;--line:#2f414b;--grid:#1f2e36;
  --accent:#62bedb;--on-accent:#08202a;--soft:#1d3843;--trace:#e7a35a;--good:#62c79d;--bad:#ef8b83;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a20;--panel:#172329;--ink:#e3ecef;--muted:#9db0ba;--line:#2f414b;--grid:#1f2e36;
  --accent:#62bedb;--on-accent:#08202a;--soft:#1d3843;--trace:#e7a35a;--good:#62c79d;--bad:#ef8b83;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--body);word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2,h3,p,ul,ol{margin:0}
h1{font:400 clamp(2rem,6vw,3.1rem)/1.15 var(--display);text-wrap:balance}
h2{font-size:1.45rem;line-height:1.35;font-weight:700;text-wrap:balance}
h3{font-size:1rem;font-weight:700}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:.88em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 .78rem/1.4 var(--mono);letter-spacing:.06em;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:grid;gap:12px;min-width:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.btn{font:500 .94rem/1.3 var(--body);padding:10px 16px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.course-card{display:grid;gap:8px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:inherit;cursor:pointer;font:inherit;width:100%}
.course-card:hover{border-color:var(--accent)}
.course-card b{font-size:1.2rem}
.trace{width:100%;height:56px;display:block}
.trace path{fill:none;stroke:var(--trace);stroke-width:1.4}
.trace line{stroke:var(--grid)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:20px;display:grid;gap:16px;min-width:0}
.plot{background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 25%;border-bottom:2px solid var(--ink);display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:96px}
.stem{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:block;height:100%}
.stem:focus-visible{outline:2px solid var(--accent)}
.stem i{position:absolute;left:50%;bottom:0;width:2px;margin-left:-1px;height:calc(6px + var(--v)*84px);background:var(--accent)}
.stem i::after{content:"";position:absolute;left:-4px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--accent)}
.stem.empty i::after{background:var(--panel)}
.stem.exam i,.stem.exam i::after{background:var(--trace);border-color:var(--trace)}
.stem.exam.empty i::after{background:var(--panel)}
.stem.now{background:var(--soft)}
.axis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);font:400 .72rem/1.6 var(--mono);color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.84rem;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:8px 14px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent)}
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
.weeks{display:grid;list-style:none;padding:0;border-top:1px solid var(--line)}
.weeks button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);width:100%;font-size:.92rem;line-height:1.45}
.weeks button:hover{background:var(--soft)}
.weeks button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.weeks button[aria-current="true"]{background:var(--soft);font-weight:700}
.weeks .n{font-family:var(--mono);color:var(--muted)}
.state{font:400 .74rem/1.9 var(--mono);color:var(--muted)}
.state.done{color:var(--good)}
.tag{font:500 .74rem/1.5 var(--mono);color:var(--trace);border:1px solid var(--trace);padding:0 6px;border-radius:3px;display:inline-block}
.block{display:grid;gap:8px;padding-top:16px;border-top:1px solid var(--line)}
.block ol,.block ul{padding-left:1.3em}
.checks{list-style:none;padding:0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:.45em;width:16px;height:16px;flex:none;accent-color:var(--accent)}

.hero-label h1{font:700 .95rem/1.3 var(--body);color:#f4f1e6}
.book{display:flex;gap:16px;align-items:flex-start}
.book img{width:96px;height:auto;border:1px solid var(--line, #ddd);border-radius:3px;flex:none}
.funcs{display:flex;flex-wrap:wrap;gap:6px}
.funcs code{background:var(--soft);padding:1px 7px;border-radius:3px}
.q{display:grid;gap:6px}
.q fieldset{border:0;padding:0;margin:0;display:grid;gap:4px}
.q legend{padding:0;font-weight:500;margin-bottom:4px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:4px;padding:7px 12px;display:block;width:100%}
.opt:hover{border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent)}
.opt.right{border-color:var(--good);color:var(--good);font-weight:500}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.why{font-size:.92rem;color:var(--muted)}
.steps{counter-reset:s;list-style:none;padding:0!important;display:grid;gap:4px}
.steps li{counter-increment:s;display:grid;grid-template-columns:24px minmax(0,1fr)}
.steps li::before{content:counter(s);font-family:var(--mono);color:var(--muted)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem;line-height:1.5}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.82rem}
td.num{font-family:var(--mono);white-space:nowrap}
tr.exam td{color:var(--trace)}
form{display:grid;gap:12px}
label.f{display:grid;gap:4px;font-weight:500;font-size:.92rem}
input[type=text],input[type=url],textarea{font:400 .95rem/1.5 var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:130px;font-family:var(--mono);font-size:.86rem}
.hint{font-weight:400;font-size:.84rem;color:var(--muted)}
.notice{padding:10px 14px;background:var(--soft);border-radius:4px;font-size:.92rem}
.notice.err{color:var(--bad)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);padding:4px;border-radius:6px}
.seg{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:10px 6px;border-radius:4px;font-weight:700;font-size:.95rem;color:var(--muted)}
.seg[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.seg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viewer{display:grid;gap:8px;min-width:0}
.frame{background:var(--bg);border:1px solid var(--line);border-radius:4px;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden;max-width:100%}
.frame img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none;user-select:none}
.controls{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deck-tabs .btn[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);font-weight:700}
.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@media (max-width:760px){
  .split{grid-template-columns:minmax(0,1fr)}
  .weekcol{display:none}
  .sheet{padding:16px}
  .axis span:nth-child(even){visibility:hidden}
}

var teacher=false,canManage=false,caps={artifact:null,downloads:null};
var view={course:null,week:1,tab:"weeks",sec:"content",deck:0,page:{}},chunks={},msg=null,confirmDelete=false,answers={};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function course(){return state.courses.find(function(c){return c.id===view.course})||null}
function weekOf(c){return c.weeks.find(function(w){return w.n===view.week})||c.weeks[0]}
function checksOf(w){return w.check&&w.check.length?w.check:["이번 주 학습을 마쳤다."]}
function prog(c){return progress[c.id]||(progress[c.id]={})}
function ratio(c,w){var p=prog(c),l=checksOf(w),d=0;l.forEach(function(_,i){if(p["w"+w.n+":"+i])d++});return d/l.length}
function courseRatio(c){if(!c.weeks.length)return 0;return c.weeks.reduce(function(a,w){return a+ratio(c,w)},0)/c.weeks.length}
function nextWeek(c){return c.weeks.find(function(w){return ratio(c,w)<1})||c.weeks[0]}
function pct(x){return Math.round(x*100)+"%"}
function safeUrl(u){return /^https:\/\/[^\s]+$/i.test(u||"")}

/* A seeded sine-plus-noise trace, unique per course. */
function trace(seed){
  var h=0,i;for(i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;
  var r=function(){h=(h*1664525+1013904223)>>>0;return h/4294967296-.5};
  var f=3+h%4,d="";
  for(i=0;i<=240;i++){var y=28-14*Math.sin(2*Math.PI*f*i/240)-14*r();d+=(i?"L":"M")+(i*2.5).toFixed(1)+" "+y.toFixed(1)}
  return '<svg class="trace" viewBox="0 0 600 56" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="28" x2="600" y2="28"/><path d="'+d+'" vector-effect="non-scaling-stroke"/></svg>';
}
function notice(){return msg?'<div class="notice'+(msg.err?" err":"")+'" role="status">'+esc(msg.text)+"</div>":""}

function renderHome(){
  var cards=state.courses.map(function(c){
    return '<button class="course-card" data-act="open" data-id="'+esc(c.id)+'">'+trace(c.id)
      +"<b>"+esc(c.title)+'</b><span class="muted">'+esc(c.subtitle||"")+"</span>"
      +'<span class="eyebrow">'+c.weeks.length+"개 주차 · 내 진도 "+pct(courseRatio(c))+"</span>"
      +'<span class="muted">'+(courseRatio(c)>0?"이어서 학습: ":"시작하기: ")+nextWeek(c).n+"주차 "+esc(nextWeek(c).title)+"</span></button>";
  }).join("");
  var form=teacher?'<section class="sheet"><div class="stack"><h2>과목 추가</h2><p class="muted">저장하면 이 교실에 바로 게시되어, 링크를 가진 모든 사람에게 보입니다.</p></div>'
    +'<form id="add-course"><label class="f">과목명<input type="text" id="c-title" required maxlength="80"></label>'
    +'<label class="f">부제 또는 한 줄 소개<input type="text" id="c-sub" maxlength="120"></label>'
    +'<label class="f">과목 개요<textarea id="c-over" style="font-family:var(--body);min-height:80px"></textarea></label>'
    +'<label class="f">주차 계획<span class="hint">한 줄에 한 주씩 씁니다. 형식: 주제 | 핵심 개념 | 실습·활동. 시험 주차는 맨 앞에 *를 붙입니다.</span>'
    +'<textarea id="c-weeks" required placeholder="AI의 이해 | 인공지능의 정의 | 생성형 AI 사용해 보기&#10;*중간평가 | 1~7주 종합 | 시험"></textarea></label>'
    +'<div class="row"><button class="btn primary" type="submit">과목 게시</button></div></form></section>':"";
  return '<header class="stack"><div class="hero" role="img" aria-label="Sun Class"><div class="hero-label"><span>ONLINE CLASSROOM</span><h1>'+esc(state.name)+'</h1></div></div><p class="muted">수강할 과목을 고르세요. 진도는 지금 쓰는 브라우저에 저장됩니다.</p></header>'
    +notice()+'<section class="courses" aria-label="과목 목록">'+cards+"</section>"+form;
}

function renderPlot(c){
  var stems=c.weeks.map(function(w){
    var v=ratio(c,w),cls="stem"+(w.exam?" exam":"")+(v===0?" empty":"")+(view.tab==="weeks"&&w.n===view.week?" now":"");
    return '<button class="'+cls+'" style="--v:'+v+'" data-act="week" data-n="'+w.n+'" aria-label="'+w.n+"주차 "+esc(w.title)+", 완료 "+pct(v)+'" title="'+w.n+"주차 "+esc(w.title)+'"><i></i></button>';
  }).join("");
  var axis=c.weeks.map(function(w){return"<span>"+w.n+"</span>"}).join("");
  return '<section class="stack" aria-label="주차별 진도"><div class="top"><span class="eyebrow">주차별 진도 · 전체 '+pct(courseRatio(c))+'</span><div class="legend"><span>막대 높이 = 정리 항목 완료율</span><span>주황 = 평가 주차</span></div></div><div><div class="plot">'+stems+'</div><div class="axis">'+axis+"</div></div></section>";
}

function renderWeek(c){
  var w=weekOf(c),p=prog(c);
  var list=c.weeks.map(function(x){var r=ratio(c,x);
    return '<li><button data-act="week" data-n="'+x.n+'"'+(x.n===w.n?' aria-current="true"':"")+'><span class="n">'+x.n+"</span><span>"+esc(x.title)+'</span><span class="state'+(r===1?" done":"")+'">'+(r===1?"완료":r>0?pct(r):"")+"</span></button></li>"}).join("");
  var out='<div class="split"><nav class="weekcol" aria-label="주차 목록"><ol class="weeks">'+list+'</ol></nav><article class="sheet">';
  out+='<div class="stack"><div class="row"><span class="eyebrow">WEEK '+String(w.n).padStart(2,"0")+"</span>"+(w.exam?'<span class="tag">평가 주차</span>':"")+"</div><h2>"+esc(w.title)+"</h2>";
  if(w.concepts)out+='<p class="muted">'+esc(w.concepts)+"</p>";
  out+="</div>";
  out+='<div class="segs" role="tablist" aria-label="이번 주 학습">'+[["content","수업내용"],["quiz","확인문제"],["summary","오늘정리"]].map(function(s){
    return '<button class="seg" role="tab" aria-selected="'+(view.sec===s[0])+'" data-act="sec" data-s="'+s[0]+'">'+s[1]+"</button>"}).join("")+"</div>";
  if(view.sec==="quiz"){
    out+=w.quiz&&w.quiz.length?'<section class="stack">'+w.quiz.map(function(q,i){return renderQ(w,q,i)}).join("")+"</section>":'<p class="muted">'+(w.exam?"평가 주차에는 확인문제가 없습니다.":"이번 주 확인문제는 준비 중입니다.")+"</p>";
  }else if(view.sec==="summary"){
    if(w.goals&&w.goals.length)out+='<section class="stack"><h3>이번 주 목표</h3><ol>'+w.goals.map(function(g){return"<li>"+esc(g)+"</li>"}).join("")+"</ol></section>";
    out+='<section class="block"><h3>'+(w.exam?"자가 점검":"오늘 정리")+'</h3><ul class="checks">'+checksOf(w).map(function(t,i){
      var id="ck-"+c.id+"-"+w.n+"-"+i;
      return '<li><label for="'+id+'"><input type="checkbox" id="'+id+'" data-act="check" data-key="w'+w.n+":"+i+'"'+(p["w"+w.n+":"+i]?" checked":"")+"><span>"+esc(t)+"</span></label></li>"}).join("")+"</ul></section>";
    if(w.reflect)out+='<section class="block"><h3>내 해석 (한 줄)</h3><p>'+esc(w.reflect)+"</p></section>";
  }else{
    if(w.note)out+='<div class="notice">'+esc(w.note)+"</div>";
    out+=renderMaterials(c,w);
    if(w.read&&w.read.length)out+='<section class="block"><h3>교재 읽기</h3><ul>'+w.read.map(function(r){return"<li>"+esc(r)+"</li>"}).join("")+"</ul></section>";
    if(w.funcs&&w.funcs.length)out+='<section class="block"><h3>새로 쓰는 것</h3><div class="funcs">'+w.funcs.map(function(f){return"<code>"+esc(f)+"</code>"}).join("")+"</div></section>";
    if(w.practice)out+='<section class="block"><h3>'+(w.exam?"평가 방식":"실습·과제")+"</h3><p>"+esc(w.practice)+"</p></section>";
  }
  var i=c.weeks.indexOf(w),prev=c.weeks[i-1],next=c.weeks[i+1];
  out+='<div class="pager">'+(prev?'<button class="btn" data-act="week" data-n="'+prev.n+'">이전: '+prev.n+"주차</button>":"<span></span>")+(next?'<button class="btn" data-act="week" data-n="'+next.n+'">다음: '+next.n+"주차</button>":"")+"</div>";
  return out+"</article></div>";
}

function renderMaterials(c,w){
  var parts=[],decks=w.decks||[];
  if(decks.length){
    var d=decks[Math.min(view.deck,decks.length-1)],pg=view.page[d.id]||0;
    parts.push((decks.length>1?'<div class="row deck-tabs">'+decks.map(function(x,i){return'<button class="btn" aria-pressed="'+(x===d)+'" data-act="deck" data-i="'+i+'">'+esc(x.label)+"</button>"}).join("")+"</div>":"")
      +'<div class="viewer" data-deck="'+esc(d.id)+'" data-n="'+d.n+'"><div class="frame"><img id="slide-img" alt="'+esc(w.title)+' 슬라이드" draggable="false"></div>'
      +'<div class="controls"><button class="btn" data-act="slide" data-d="-1">이전</button><span class="mono" id="slide-count">'+(pg+1)+" / "+d.n+'</span><button class="btn" data-act="slide" data-d="1">다음</button></div></div>');
  }
  var links=(w.links||[]).filter(function(l){return safeUrl(l.url)});
  if(links.length)parts.push('<ul>'+links.map(function(l,i){return'<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+"</a>"+(teacher?' <button class="link" data-act="del-link" data-i="'+(w.links||[]).indexOf(l)+'">삭제</button>':"")+"</li>"}).join("")+"</ul>");
  if(teacher)parts.push('<form id="add-link"><div class="row" style="align-items:end"><label class="f" style="flex:1 1 160px">자료 이름<input type="text" id="l-label" required maxlength="80" placeholder="예: Colab 공유 링크"></label><label class="f" style="flex:2 1 240px">주소 (https)<input type="url" id="l-url" required placeholder="https://"></label><button class="btn" type="submit">자료 게시</button></div></form>');
  if(w.exam&&!parts.length)return"";
  if(!decks.length&&w.read&&!parts.length)return"";
  if(!decks.length)parts.unshift('<p class="muted">이번 주 수업 슬라이드는 준비 중입니다.</p>');
  return '<section class="stack">'+parts.join("")+"</section>";
}
function paintSlide(){
  var v=document.querySelector(".viewer"),img=document.getElementById("slide-img");if(!v||!img)return;
  var id=v.dataset.deck,pg=view.page[id]||0,k=Math.floor(pg/10),key=id+"/"+k;
  document.getElementById("slide-count").textContent=(pg+1)+" / "+v.dataset.n;
  var show=function(list){if(view.page[id]===undefined||view.page[id]===pg)img.src=list[pg%10]};
  if(chunks[key]){show(chunks[key]);return}
  img.removeAttribute("src");
  fetch("d/"+key+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(list){chunks[key]=list;if(document.getElementById("slide-img")===img)show(list)})
    .catch(function(){if(document.getElementById("slide-img")===img){msg={err:true,text:"슬라이드를 불러오지 못했습니다. 페이지를 새로 고쳐 주세요."};render()}});
}
function moveSlide(delta){
  var v=document.querySelector(".viewer");if(!v)return;
  var id=v.dataset.deck,n=Number(v.dataset.n),pg=(view.page[id]||0)+delta;
  if(pg<0||pg>=n)return;
  view.page[id]=pg;paintSlide();
}

function renderQ(w,q,i){
  var k=w.n+":"+i,a=answers[k],done=a!==undefined;
  var opts=q.options.map(function(o,j){
    var cls="opt"+(done&&j===q.a?" right":"")+(done&&j===a&&j!==q.a?" wrong":"");
    return '<button class="'+cls+'" data-act="answer" data-k="'+k+'" data-j="'+j+'">'+esc(o)+"</button>"}).join("");
  return '<div class="q"><fieldset><legend>'+(i+1)+". "+esc(q.q)+"</legend>"+opts+"</fieldset>"+(done?'<p class="why" role="status">'+(a===q.a?"맞습니다. ":"다시 볼까요? ")+esc(q.why)+"</p>":"")+"</div>";
}

function renderInfo(c){
  var o='<article class="sheet">';
  if(c.overview)o+='<section class="stack"><h2>과목 개요</h2><p>'+esc(c.overview)+"</p></section>";
  if(c.book){var b=c.book;o+='<section class="block"><h3>교재</h3><div class="book">'+(/^data:image\/(jpeg|png);/.test(b.cover||"")?'<img src="'+b.cover+'" alt="'+esc(b.title)+' 표지">':"")+'<div class="stack"><b>『'+esc(b.title)+"』</b><span>"+esc([b.author,b.publisher,b.year].filter(Boolean).join(" · "))+"</span>"+(b.note?'<p class="muted">'+esc(b.note)+"</p>":"")+(safeUrl(b.url||"")?'<a href="'+esc(b.url)+'" target="_blank" rel="noopener">교재 구매하기</a>':"")+"</div></div></section>"}
  if(c.meta&&c.meta.length)o+='<section class="block"><h3>수업 정보</h3><div class="table-wrap"><table><tbody>'+c.meta.map(function(m){return'<tr><th scope="row">'+esc(m[0])+"</th><td>"+esc(m[1])+"</td></tr>"}).join("")+"</tbody></table></div></section>";
  if(c.objectives&&c.objectives.length)o+='<section class="block"><h3>학습목표</h3><ol>'+c.objectives.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+"</ol></section>";
  if(c.rhythm&&c.rhythm.length)o+='<section class="block"><h3>주당 수업 구성</h3><div class="table-wrap"><table><tbody>'+c.rhythm.map(function(m){return'<tr><th scope="row">'+esc(m[0])+"</th><td>"+esc(m[1])+"</td></tr>"}).join("")+"</tbody></table></div></section>";
  o+='<section class="block"><h3>주차별 계획</h3><div class="table-wrap"><table><thead><tr><th>주</th><th>주제</th><th>핵심 개념</th><th>실습·활동</th></tr></thead><tbody>'+c.weeks.map(function(w){return'<tr'+(w.exam?' class="exam"':"")+'><td class="num">'+w.n+"</td><td>"+esc(w.title)+"</td><td>"+esc(w.concepts||"")+"</td><td>"+esc(w.practice||"")+"</td></tr>"}).join("")+"</tbody></table></div></section>";
  if(c.grading&&c.grading.length)o+='<section class="block"><h3>평가</h3><div class="table-wrap"><table><thead><tr><th>항목</th><th>비율</th><th>내용</th></tr></thead><tbody>'+c.grading.map(function(g){return"<tr><td>"+esc(g[0])+'</td><td class="num">'+esc(g[1])+"</td><td>"+esc(g[2])+"</td></tr>"}).join("")+"</tbody></table></div></section>";
  if(teacher&&c.added)o+='<section class="block"><h3>과목 관리</h3>'+(confirmDelete?'<p>이 과목을 교실에서 내립니다. 계속할까요?</p><div class="row"><button class="btn danger" data-act="del-course">삭제</button><button class="btn" data-act="cancel-del">취소</button></div>':'<div><button class="btn danger" data-act="ask-del">이 과목 삭제</button></div>')+"</section>";
  return o+"</article>";
}

function renderCourse(c){
  return '<header class="stack"><div><button class="link" data-act="home">전체 과목</button></div><h1>'+esc(c.title)+'</h1><p class="muted">'+esc(c.subtitle||"")+"</p></header>"+notice()+renderPlot(c)
    +'<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="'+(view.tab==="weeks")+'" data-act="tab" data-t="weeks">주차 학습</button><button class="tab" role="tab" aria-selected="'+(view.tab==="info")+'" data-act="tab" data-t="info">강의 안내</button></div>'
    +(view.tab==="info"?renderInfo(c):renderWeek(c));
}
function modeBar(){
  if(!canManage)return"";
  return '<div class="notice top"><span>'+(teacher?"관리 화면입니다. 수강생에게는 과목 추가와 자료 관리 도구가 보이지 않습니다.":"수강생에게 보이는 화면입니다.")+'</span><button class="btn" data-act="mode">'+(teacher?"수강생 화면 보기":"관리 화면 열기")+"</button></div>";
}
function render(){var c=course();app.innerHTML=modeBar()+(c?renderCourse(c):renderHome());paintSlide()}

function setHash(){try{var c=course();location.hash=c?(view.tab==="info"?c.id+"-info":c.id+"-w"+view.week):""}catch(e){}}
function route(){
  var h="";try{h=location.hash.slice(1)}catch(e){}
  var m=/^(.+)-(w(\d+)|info)$/.exec(h),id=m?m[1]:h;
  if(state.courses.some(function(c){return c.id===id})){
    view.course=id;view.tab=m&&m[2]==="info"?"info":"weeks";
    var c=course();view.week=m&&m[3]?Number(m[3]):nextWeek(c).n;
  }else view.course=null;
}

/* Shared changes republish the whole page; open views reload to the new version. */
function buildDoc(next){
  var reset=document.head.querySelector("style");
  var close="<"+"/script>";
  var title=document.querySelector("title").outerHTML;
  var meta=document.querySelector('meta[name="claude:viewport-fit-sides"]').outerHTML;
  var font=document.querySelector('link[rel="stylesheet"]').outerHTML;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+(reset?reset.textContent:"")+"</style></head><body>"
    +title+meta+font+'<style id="app-style">'+document.getElementById("app-style").textContent+'</style><div id="app"></div>'
    +'<script type="application/json" id="courses-data">'+JSON.stringify(next).replace(/</g,"\\u003c")+close
    +'<script type="application/json" id="notebooks-data">'+document.getElementById("notebooks-data").textContent+close
    +'<script id="app-code">'+document.getElementById("app-code").textContent+close+"</body></html>";

async function share(next,done){
  if(!caps.artifact){msg={err:true,text:"이 화면에서는 저장할 수 없습니다. 교실 소유자 계정으로 열어 주세요."};render();return}
  msg={text:"게시하는 중입니다."};render();
  try{await caps.artifact.publish(buildDoc(next));state=next;msg={text:done};render()}
  catch(e){
    if(e&&e.code==="conflict")msg={text:"다른 곳에서 먼저 저장되어 새 버전을 불러옵니다. 다시 입력해 주세요."};
    else if(e&&(e.code==="not_writer"||e.code==="not_granted")){teacher=false;canManage=false;msg={err:true,text:"이 계정은 읽기 전용이라 저장할 수 없습니다."}}
    else msg={err:true,text:"저장하지 못했습니다. 잠시 후 다시 시도해 주세요."};
    render();
  }
}
function clone(){return JSON.parse(JSON.stringify(state))}

/* Minimal store-only zip: .ipynb is not an allowed save type, .zip is. */
var crcT=null;
function crc32(b){
  if(!crcT){crcT=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crcT[n]=c>>>0}}
  var r=-1;for(var i=0;i<b.length;i++)r=crcT[(r^b[i])&255]^(r>>>8);return(r^-1)>>>0;
}
function zipOne(name,text){
  var en=new TextEncoder(),nm=en.encode(name),d=en.encode(text),crc=crc32(d);
  var loc=new DataView(new ArrayBuffer(30)),cen=new DataView(new ArrayBuffer(46)),end=new DataView(new ArrayBuffer(22));
  loc.setUint32(0,0x04034b50,true);loc.setUint16(4,20,true);loc.setUint16(6,0x0800,true);loc.setUint32(14,crc,true);loc.setUint32(18,d.length,true);loc.setUint32(22,d.length,true);loc.setUint16(26,nm.length,true);
  cen.setUint32(0,0x02014b50,true);cen.setUint16(4,20,true);cen.setUint16(6,20,true);cen.setUint16(8,0x0800,true);cen.setUint32(16,crc,true);cen.setUint32(20,d.length,true);cen.setUint32(24,d.length,true);cen.setUint16(28,nm.length,true);
  var off=30+nm.length+d.length,cs=46+nm.length;
  end.setUint32(0,0x06054b50,true);end.setUint16(8,1,true);end.setUint16(10,1,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([loc.buffer,nm,d,cen.buffer,nm,end.buffer]);
}
async function getNotebook(file){
  if(!caps.downloads){msg={err:true,text:"이 화면에서는 파일을 저장할 수 없습니다. 담당 교수에게 자료를 요청해 주세요."};render();return}
  try{await caps.downloads.save({filename:file.replace(/\.ipynb$/,"")+".zip",data:zipOne(file,notebooks[file])})}
  catch(e){if(!e||e.code!=="declined"){msg={err:true,text:"파일을 저장하지 못했습니다. 담당 교수에게 자료를 요청해 주세요."};render()}}
}

app.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-act]");if(!t||t.type==="checkbox")return;
  var a=t.dataset.act,keep=false;
  if(a==="slide"){moveSlide(Number(t.dataset.d));return}
  msg=null;
  if(a==="sec"){view.sec=t.dataset.s;keep=true}
  else if(a==="deck"){view.deck=Number(t.dataset.i);keep=true}
  else if(a==="mode"){teacher=!teacher;confirmDelete=false;try{sessionStorage.setItem(KEY+"-manage",teacher?"1":"")}catch(e){}keep=true}
  else if(a==="open"){view.course=t.dataset.id;view.tab="weeks";view.week=nextWeek(course()).n}
  else if(a==="home"){view.course=null;confirmDelete=false}
  else if(a==="week"){view.week=Number(t.dataset.n);view.tab="weeks";view.sec="content";view.deck=0}
  else if(a==="tab"){view.tab=t.dataset.t;confirmDelete=false}
  else if(a==="answer"){answers[t.dataset.k]=Number(t.dataset.j);keep=true}
  else if(a==="notebook"){getNotebook(t.dataset.file);return}
  else if(a==="ask-del"){confirmDelete=true;keep=true}
  else if(a==="cancel-del"){confirmDelete=false;keep=true}
  else if(a==="del-course"){var n=clone();n.courses=n.courses.filter(function(c){return c.id!==view.course});view.course=null;confirmDelete=false;setHash();share(n,"과목을 삭제했습니다.");return}
  else if(a==="del-link"){var m=clone(),mc=m.courses.find(function(c){return c.id===view.course}),mw=mc.weeks.find(function(w){return w.n===view.week});mw.links.splice(Number(t.dataset.i),1);share(m,"자료를 삭제했습니다.");return}
  render();
  if(!keep){setHash();try{window.scrollTo(0,0)}catch(e){}}
});
app.addEventListener("change",function(ev){
  var t=ev.target;if(t.dataset.act!=="check")return;
  var c=course(),p=prog(c);p[t.dataset.key]=t.checked;saveProgress();render();
  var again=document.getElementById(t.id);if(again)again.focus();
});
app.addEventListener("submit",function(ev){
  ev.preventDefault();
  if(ev.target.id==="add-course"){
    var title=document.getElementById("c-title").value.trim();
    var weeks=[];document.getElementById("c-weeks").value.split(/\r?\n/).forEach(function(l){
      l=l.trim();if(!l)return;var ex=l[0]==="*";if(ex)l=l.slice(1);
      var p=l.split("|").map(function(s){return s.trim()});
      weeks.push({n:weeks.length+1,title:p[0],concepts:p[1]||"",practice:p[2]||"",exam:ex});
    });
    if(!title||!weeks.length){msg={err:true,text:"과목명과 주차를 한 줄 이상 입력해 주세요."};render();return}
    var n=clone();
    n.courses.push({id:"course-"+Date.now().toString(36),added:true,title:title,subtitle:document.getElementById("c-sub").value.trim(),overview:document.getElementById("c-over").value.trim(),weeks:weeks});
    share(n,"과목을 게시했습니다.");
  }else if(ev.target.id==="add-link"){
    var label=document.getElementById("l-label").value.trim(),url=document.getElementById("l-url").value.trim();
    if(!label||!safeUrl(url)){msg={err:true,text:"자료 이름과 https로 시작하는 주소를 입력해 주세요."};render();return}
    var m=clone(),mc=m.courses.find(function(c){return c.id===view.course}),mw=mc.weeks.find(function(w){return w.n===view.week});
    (mw.links=mw.links||[]).push({label:label,url:url});
    share(m,"자료를 게시했습니다.");
  }
});
document.addEventListener("keydown",function(ev){
  if(/INPUT|TEXTAREA/.test(ev.target.tagName))return;
  if(ev.key==="ArrowLeft")moveSlide(-1);else if(ev.key==="ArrowRight")moveSlide(1);
});
app.addEventListener("contextmenu",function(ev){if(ev.target.id==="slide-img")ev.preventDefault()});
window.addEventListener("hashchange",function(){route();render()});
route();render();

if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(a){caps.artifact=a});
  window.claude.use("downloads").then(function(d){caps.downloads=d});
  window.claude.use("user").then(function(u){if(u&&u.canEdit()){canManage=true;try{teacher=sessionStorage.getItem(KEY+"-manage")==="1"}catch(e){}render()}});
}
})();
</script>
